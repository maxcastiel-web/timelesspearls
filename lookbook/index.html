/* ===================== DRAWING ===================== */
let GID=0;
function uid(){return "g"+(GID++)}
function pearlGrads(D,t){
  const a=uid(),b=uid();
  D.push(`<radialGradient id="${a}" cx="38%" cy="32%" r="74%"><stop offset="0" stop-color="${t.hi}"/><stop offset=".5" stop-color="${t.mid}"/><stop offset="1" stop-color="${t.edge}"/></radialGradient>`);
  D.push(`<radialGradient id="${b}" cx="62%" cy="80%" r="55%"><stop offset="0" stop-color="${t.sheen}" stop-opacity=".8"/><stop offset="1" stop-color="${t.sheen}" stop-opacity="0"/></radialGradient>`);
  return [a,b];
}
function pearl(D,cx,cy,r,tn,shadow){
  const t=TINT[tn]||TINT.white,[a,b]=pearlGrads(D,t);
  let s="";
  if(shadow) s+=`<ellipse cx="${cx}" cy="${cy+r*1.02}" rx="${r*.8}" ry="${r*.14}" fill="#1D2536" opacity=".10"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${a})"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${b})"/>`;
  s+=`<ellipse cx="${cx-r*.33}" cy="${cy-r*.38}" rx="${r*.22}" ry="${r*.12}" fill="#fff" opacity=".8" transform="rotate(-32 ${cx-r*.33} ${cy-r*.38})"/>`;
  return s;
}
function tearPath(cx,cy,r){
  return `M${cx} ${cy-1.55*r} C${cx+.45*r} ${cy-1.0*r} ${cx+r} ${cy-.45*r} ${cx+r} ${cy+.2*r} A${r} ${r} 0 0 1 ${cx-r} ${cy+.2*r} C${cx-r} ${cy-.45*r} ${cx-.45*r} ${cy-1.0*r} ${cx} ${cy-1.55*r} Z`;
}
function tear(D,cx,cy,r,tn){
  const t=TINT[tn]||TINT.white,[a,b]=pearlGrads(D,t);
  const d=tearPath(cx,cy,r);
  return `<path d="${d}" fill="url(#${a})"/><path d="${d}" fill="url(#${b})"/><ellipse cx="${cx-r*.32}" cy="${cy-r*.25}" rx="${r*.17}" ry="${r*.3}" fill="#fff" opacity=".7" transform="rotate(18 ${cx-r*.32} ${cy-r*.25})"/>`;
}
function gemGrad(D,kind){
  const id=uid();
  if(kind==="sapphire") D.push(`<radialGradient id="${id}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6F8FD8"/><stop offset=".55" stop-color="#2A4A9A"/><stop offset="1" stop-color="#14245A"/></radialGradient>`);
  else D.push(`<radialGradient id="${id}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E9EDF3"/><stop offset="1" stop-color="#B9C2CF"/></radialGradient>`);
  return id;
}
function gem(D,cx,cy,r,metal,kind){
  const m=METAL[metal]||METAL.silver,id=gemGrad(D,kind);
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" stroke="${m.s}" stroke-width="${Math.max(.6,r*.14)}"/>`;
  if(r>=3.5) s+=`<path d="M${cx-r*.55} ${cy}H${cx+r*.55}M${cx} ${cy-r*.55}V${cy+r*.55}" stroke="#fff" stroke-width="${r*.12}" opacity=".85"/>`;
  return s;
}
function sqgem(D,cx,cy,r,metal){
  const m=METAL[metal]||METAL.silver,id=gemGrad(D);
  return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" fill="url(#${id})" stroke="${m.s}" stroke-width="${r*.18}"/><path d="M${cx-r} ${cy-r}L${cx+r} ${cy+r}M${cx+r} ${cy-r}L${cx-r} ${cy+r}" stroke="#fff" stroke-width="${r*.1}" opacity=".7"/>`;
}
function emerald(D,cx,cy,r,metal){
  const m=METAL[metal]||METAL.silver,id=gemGrad(D),w=r*1.4,h=r*2;
  return `<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${r*.18}" fill="url(#${id})" stroke="${m.s}" stroke-width="${r*.16}"/><rect x="${cx-w/4}" y="${cy-h/4}" width="${w/2}" height="${h/2}" fill="none" stroke="#fff" stroke-width="${r*.1}" opacity=".85"/>`;
}
function peargem(D,cx,cy,r,metal){
  const m=METAL[metal]||METAL.silver,id=gemGrad(D);
  return `<path d="${tearPath(cx,cy,r)}" fill="url(#${id})" stroke="${m.s}" stroke-width="${r*.16}"/>`;
}
function facet(D,cx,cy,r,metal){
  const m=METAL[metal]||METAL.silver,id=uid(),rb=uid();
  D.push(`<radialGradient id="${id}" cx="42%" cy="38%" r="72%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E6ECF4"/><stop offset="1" stop-color="#A9B4C4"/></radialGradient>`);
  D.push(`<linearGradient id="${rb}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D7F0" stop-opacity=".0"/><stop offset=".45" stop-color="#CDE6FF" stop-opacity=".55"/><stop offset=".7" stop-color="#FFF1C7" stop-opacity=".45"/><stop offset="1" stop-color="#E5D6FF" stop-opacity="0"/></linearGradient>`);
  const o=[],t=[];
  for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);t.push([cx+r*.52*Math.cos(a),cy+r*.52*Math.sin(a)]);}
  const poly=p=>p.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  let s="";
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;s+=`<circle cx="${cx+r*1.0*Math.cos(a)}" cy="${cy+r*1.0*Math.sin(a)}" r="${r*.1}" fill="${m.f}" stroke="${m.s}" stroke-width="${r*.03}"/>`;}
  s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${rb})"/>`+`<polygon points="${poly(t)}" fill="none" stroke="#fff" stroke-width="${r*.04}"/>`+
    o.map((p,i)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${t[i][0]}" y2="${t[i][1]}" stroke="#8D9AAD" stroke-width="${r*.025}" opacity=".7"/>`).join("")+
    t.map((p,i)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${cx}" y2="${cy}" stroke="#fff" stroke-width="${r*.02}" opacity=".55"/>`).join("")+
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${m.s}" stroke-width="${r*.05}"/>`+s;
  return s;
}
function stud(D,cx,cy,r,o){
  const tn=o.tint||"white",metal=o.metal||"silver",deco=o.deco||"none",k=o.gem;
  const m=METAL[metal];let s="",pre="";
  const at=(ang,dist,gr)=>gem(D,cx+dist*Math.cos(ang*Math.PI/180),cy+dist*Math.sin(ang*Math.PI/180),gr,metal,k);
  if(deco==="halo"){pre+=`<circle cx="${cx}" cy="${cy}" r="${r*1.2}" fill="none" stroke="${m.s}" stroke-width="${r*.12}"/>`;for(let i=0;i<16;i++)s+=at(i*22.5,r*1.2,r*.16);}
  if(deco==="clover")[45,135,225,315].forEach(a=>s+=at(a,r*1.08,r*.3));
  if(deco==="vendome")[0,90,180,270].forEach(a=>s+=at(a,r*1.13,r*.25));
  if(deco==="tristar")[-130,-90,-50].forEach(a=>s+=at(a,r*1.22,r*.25));
  if(deco==="stellar")[-95,-70,-45,-20].forEach((a,i)=>s+=at(a,r*1.16,r*(.12+i*.035)));
  if(deco==="solitaire")s+=gem(D,cx,cy-r*1.32,r*.3,metal,k);
  if(deco==="post")pre+=`<circle cx="${cx}" cy="${cy}" r="${r*1.07}" fill="${m.f}" opacity=".9"/>`;
  return pre+pearl(D,cx,cy,r,tn,true)+s;
}
/* vertical stack (drop earrings / pendants) at x=0, starting y=0 */
function stack(D,parts,metal,tn){
  const m=METAL[metal]||METAL.silver;let y=0,s="";
  parts.forEach(p=>{
    const [k,v]=p.split(":"),r=parseFloat(v);
    if(k==="hook"){s+=`<path d="M0 ${y+24}V${y+9}a8 8 0 0 1 16 0v6" fill="none" stroke="${m.s}" stroke-width="1.7" stroke-linecap="round"/>`;y+=24;}
    else if(k==="link"){s+=`<line x1="0" y1="${y}" x2="0" y2="${y+6}" stroke="${m.s}" stroke-width="1.3"/>`;y+=6;}
    else if(k==="gem"){s+=gem(D,0,y+r,r,metal);y+=2*r+1;}
    else if(k==="sq"){s+=sqgem(D,0,y+r,r,metal);y+=2*r+1.5;}
    else if(k==="emerald"){s+=emerald(D,0,y+r,r,metal);y+=2*r;}
    else if(k==="peargem"){s+=peargem(D,0,y+1.55*r,r,metal);y+=2.75*r;}
    else if(k==="pearl"){s+=pearl(D,0,y+r,r,tn);y+=2*r;}
    else if(k==="tear"){s+=tear(D,0,y+1.55*r,r,tn);y+=2.75*r;}
    else if(k==="facet"){s+=facet(D,0,y+r,r,metal);y+=2*r;}
    else if(k==="pave"){s+=`<path d="M-17 ${y+4}Q0 ${y+26} 17 ${y+4}" fill="none" stroke="${m.s}" stroke-width="1.4"/>`;
      [-15,-10,-5,0,5,10,15].forEach(x=>{const yy=y+4+(1-(x/17)**2)*11;s+=gem(D,x,yy,2.6,metal);});y+=17;}
    else if(k==="ring"){for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=gem(D,13*Math.cos(a),y+14+13*Math.sin(a),3.1,metal);}y+=29;}
    else if(k==="hoop"){s+=`<circle cx="0" cy="${y+26}" r="25" fill="none" stroke="${m.s}" stroke-width="2.6"/><circle cx="0" cy="${y+26}" r="25" fill="none" stroke="${m.f}" stroke-width="1" opacity=".8"/>`;y+=49;}
    else if(k==="square"){[[-11,-11],[0,-11],[11,-11],[-11,0],[11,0],[-11,11],[0,11],[11,11]].forEach(q=>s+=gem(D,q[0],y+13+q[1],4,metal));y+=29;}
  });
  return {s,h:y};
}
function pendantAt(D,cx,x0,x1,top,bottom,parts,metal,tn,maxH){
  const m=METAL[metal]||METAL.silver,ctrlY=bottom*2-top;
  let s=`<path d="M${x0} ${top}Q${cx} ${ctrlY} ${x1} ${top}" fill="none" stroke="${m.s}" stroke-width="1.1"/>`;
  const st=stack(D,["link",...parts],metal,tn),sc=Math.min(1.25,maxH/st.h);
  s+=`<g transform="translate(${cx} ${bottom}) scale(${sc})">${st.s}</g>`;
  return s;
}
function catPoint(x0,x1,top,cy,t){const cx=(x0+x1)/2,c=2*cy-top;return [(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,(1-t)*(1-t)*top+2*(1-t)*t*c+t*t*top];}
function art(a){
  const D=[];let b="";

  if(a.type==="studs"){
    const n=a.items.length,r=a.r||Math.min(40,300/n/2.7),gap=W/(n+1);
    a.items.forEach((it,i)=>b+=stud(D,gap*(i+1),H*.54,r,it));
  } else if(a.type==="drops"){
    const st=stack(D,(a.hook===false?[]:[]).concat(a.parts[0]==="hook"||a.hook===false?a.parts:["hook","link",...a.parts]),a.metal||"silver",a.tint);
    const sc=Math.min(1.6,196/st.h),y0=(H-st.h*sc)/2;
    const xs=a.single?[180]:[135,225];
    xs.forEach(x=>b+=`<g transform="translate(${x} ${y0}) scale(${sc})">${st.s}</g>`);
  } else if(a.type==="pendant"){

  } else if(a.type==="pendants2"){
    a.v.forEach((v,i)=>{const cx=i?262:98;b+=pendantAt(D,cx,cx-78,cx+78,6,88,a.parts,v[0],v[1],124);});
  } else if(a.type==="station"){
    const x0=20,x1=340,top=a.studs?6:18,cy=a.studs?150:190;
    b+=`<path d="M${x0} ${top}Q180 ${cy*2-top-((a.studs?150:190)*1-cy)} ${x1} ${top}" fill="none" stroke="${METAL.gold.s}" stroke-width="1.1"/>`;
    for(let i=0;i<7;i++){const t=.2+i*.1,[x,y]=catPoint(x0,x1,top,cy,t);b+=pearl(D,x,y,10.5,"white");}
    if(a.studs){b+=stud(D,150,180,13,{tint:"white",deco:"post",metal:"gold"})+stud(D,210,180,13,{tint:"white",deco:"post",metal:"gold"});}
  } else if(a.type==="set"){
    b+=pendantAt(D,118,30,206,6,86,a.pend,a.metal,a.tint,124);
    if(a.ear.type==="studs"){b+=stud(D,262,112,17,{tint:a.tint,deco:a.ear.deco,metal:a.metal})+stud(D,318,112,17,{tint:a.tint,deco:a.ear.deco,metal:a.metal});}
    else{const st=stack(D,a.ear.parts,a.metal,a.tint),sc=170/st.h,y0=(H-st.h*sc)/2;[262,318].forEach(x=>b+=`<g transform="translate(${x} ${y0}) scale(${sc})">${st.s}</g>`);}
  } else if(a.type==="mstuds"){
    const r=a.r||40,xs=a.single?[180]:[128,232];xs.forEach(x=>b+=`<ellipse cx="${x}" cy="${H*.52+r*1.05}" rx="${r*.75}" ry="${r*.13}" fill="#1D2536" opacity=".1"/>`+facet(D,x,H*.52,r,"silver"));
  } else if(a.type==="cover"){
    b+=pearl(D,180,112,84,"white");
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true"><defs>${D.join("")}</defs>${b}</svg>`;
}
